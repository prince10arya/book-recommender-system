[project]
name = "book-recommender-backend"
version = "2.0.0"
description = "Book Recommender — microservices backend (preprocessing, embedding, retrieval)"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "langchain-community",
    "langchain-text-splitters",
    "langchain-chroma",
    "langchain-google-genai",
    "google-generativeai",
    "pandas",
    "numpy",
    "python-dotenv",
    "pydantic-settings",
    "chromadb",
    "tqdm",
   "python-multipart",

]

[tool.setuptools.packages.find]
where = ["."]
include = ["shared*", "preprocessing_service*", "embedding_service*", "retrieval_service*"]
